plugins {
    id 'com.android.application'
}

android {
    namespace 'com.waterclient.overlay'
    compileSdk 35

    defaultConfig {
        applicationId 'com.waterclient.overlay'
        minSdk 26
        targetSdk 32
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
